name: Refresh Index Valuation Tracker and deploy Pages

on:
  workflow_dispatch:
    inputs:
      test_email_alert:
        description: 'Send a test threshold email on this run'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 19 * * 1-5'
      timezone: 'Asia/Kolkata'
  push:
    branches: ['main']
    paths:
      - 'docs/**'
      - 'nifty_tracker_update.py'
      - 'multi_index_tracker.py'
      - 'requirements.txt'
      - 'nifty_quarterly_backtest.csv'
      - 'multi_index_quarterly.csv'
      - 'multi_index_monthly.csv'
      - 'NIFTY_Valuation_Backtest_Live_Tracker.xlsx'
      - '.github/workflows/nifty-tracker.yml'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: index-valuation-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        if: github.event_name != 'push'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        if: github.event_name != 'push'
        run: python -m pip install -r requirements.txt

      - name: Refresh NIFTY 50 model and alerts
        if: github.event_name != 'push'
        env:
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '465' }}
          SMTP_FROM: ${{ vars.SMTP_FROM || secrets.SMTP_USERNAME }}
          ALERT_PE_DELTA: ${{ vars.ALERT_PE_DELTA || '0.10' }}
          ALERT_NIFTY_DELTA_PCT: ${{ vars.ALERT_NIFTY_DELTA_PCT || '0.005' }}
          FORCE_THRESHOLD_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email_alert || false }}
          DASHBOARD_URL: https://projectdwister.github.io/index-valuation-tracker/
        run: >-
          python nifty_tracker_update.py
          --workbook NIFTY_Valuation_Backtest_Live_Tracker.xlsx
          --backtest-csv nifty_quarterly_backtest.csv
          --web-dir docs

      - name: Refresh multi-index universe and backtests
        if: github.event_name != 'push'
        run: >-
          python multi_index_tracker.py
          --web-dir docs
          --quarterly-csv multi_index_quarterly.csv
          --monthly-csv multi_index_monthly.csv

      - name: Commit refreshed model history
        if: github.event_name != 'push'
        run: |
          git config user.name "Index Valuation Tracker Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add NIFTY_Valuation_Backtest_Live_Tracker.xlsx nifty_quarterly_backtest.csv multi_index_quarterly.csv multi_index_monthly.csv docs/data docs/downloads
          if ! git diff --cached --quiet; then
            git commit -m "Index valuation and backtest update"
            git push
          else
            echo "No model changes to commit."
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
